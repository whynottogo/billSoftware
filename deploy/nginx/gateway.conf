server {
    listen 80;
    server_name www.qiqiqu.cn;

    return 301 https://www.qiqiqu.cn$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.qiqiqu.cn;

    ssl_certificate /etc/nginx/certs/www.qiqiqu.cn.pem;
    ssl_certificate_key /etc/nginx/certs/www.qiqiqu.cn.key;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 20m;

    location = / {
        return 301 /pc/user/login;
    }

    location = /pc {
        return 301 /pc/;
    }

    location /pc/ {
        proxy_pass http://bill-frontend:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://bill-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /mobile {
        return 404;
    }

    location /mobile/ {
        return 404;
    }
}
